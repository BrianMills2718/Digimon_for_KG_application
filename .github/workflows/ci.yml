name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Core MCP path
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-minimal.txt

      - name: Install minimal core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-minimal.txt

      - name: Import MCP server
        run: python -c "import digimon_mcp_stdio_server; print('DIGIMON MCP import OK')"

      - name: Compile canonical core
        run: |
          python -m compileall -q \
            Core/Schema \
            Core/Composition \
            Core/Operators \
            Core/Methods \
            Core/Graph/GraphFactory.py \
            Core/AgentTools/query_expansion.py \
            digimon_mcp_stdio_server.py

      - name: Run deterministic core contracts
        run: pytest tests/core -q

  style-advisory:
    name: Style advisory
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check formatting on maintained core
        run: |
          python -m pip install --upgrade pip
          pip install black
          black --check \
            Core/Schema \
            Core/Composition \
            Core/Operators/meta \
            Core/Graph/GraphFactory.py \
            Core/AgentTools/query_expansion.py \
            tests/core \
            digimon_mcp_stdio_server.py
