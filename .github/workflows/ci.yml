name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Core contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.11" "loguru>=0.7" "pytest>=7" "pytest-asyncio>=0.21"

      - name: Compile canonical core
        run: |
          python -m compileall -q \
            Core/Schema \
            Core/Composition \
            Core/Operators \
            Core/Methods \
            digimon_mcp_stdio_server.py

      - name: Run deterministic core contracts
        run: pytest tests/core -q

  style-advisory:
    name: Style advisory
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check formatting on maintained core
        run: |
          python -m pip install --upgrade pip
          pip install black
          black --check \
            Core/Schema \
            Core/Composition \
            Core/Operators/meta \
            tests/core \
            digimon_mcp_stdio_server.py
